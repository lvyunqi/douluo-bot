name: 发布斗罗动态插件

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的既有 SemVer tag，例如 v0.1.0'
        required: true
        type: string

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  PLUGIN_ID: douluo-game
  LIB_STEM: qimen_dynamic_plugin_douluo_game
  RUST_VERSION: '1.89.0'
  PNPM_VERSION: '10.33.0'
  CARGO_TERM_COLOR: always

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - name: 检查插件身份
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          expected="qimen_dynamic_plugin_${PLUGIN_ID//-/_}"
          test "$LIB_STEM" = "$expected"
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${RELEASE_TAG#v}"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          plugin_version="$(sed -n '/#\[dynamic_plugin(/,/)]/{s/^[[:space:]]*version = "\([^"]*\)",/\1/p}' src/lib.rs)"
          test "$cargo_version" = "$version"
          test "$plugin_version" = "$version"
          grep -F 'api = "0.6"' src/lib.rs
          test "$(git describe --tags --exact-match HEAD)" = "$RELEASE_TAG"
      - run: pnpm --dir web install --frozen-lockfile
      - run: cargo +${{ env.RUST_VERSION }} fmt --all -- --check
      - run: cargo +${{ env.RUST_VERSION }} clippy --locked --all-targets -- -D warnings
      - run: cargo +${{ env.RUST_VERSION }} test --locked --all-targets -- --test-threads=8

  build-windows:
    needs: verify
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
      - run: pnpm --dir web install --frozen-lockfile
      - name: 构建 Windows x64 资产
        run: cargo +${{ env.RUST_VERSION }} build --locked --release --target x86_64-pc-windows-msvc
      - name: 准备 Release 资产
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release-assets | Out-Null
          $source = "target/x86_64-pc-windows-msvc/release/$env:LIB_STEM.dll"
          $asset = "release-assets/$env:LIB_STEM-x86_64-pc-windows-msvc.dll"
          Copy-Item $source $asset
          $hash = (Get-FileHash $asset -Algorithm SHA256).Hash.ToLower()
          "$hash  $([IO.Path]::GetFileName($asset))" | Set-Content -Encoding ascii "$asset.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-x86_64-pc-windows-msvc
          path: release-assets/*
          if-no-files-found: error

  publish:
    needs: [build-windows]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          name: plugin-x86_64-pc-windows-msvc
          path: release-assets
      - name: 校验发布 tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$(git describe --tags --exact-match HEAD)" = "$RELEASE_TAG"
      - name: 生成构建来源证明
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release-assets/*.dll
      - name: 创建或更新 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
